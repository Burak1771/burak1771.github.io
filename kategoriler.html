```html
<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ürün Kategorileri</title>


    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }


        header {
            background: #111;
            padding: 20px 6%;
        }


        header a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }


        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }


        h1 {
            text-align: center;
            margin-bottom: 35px;
        }


        .kategoriler {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }


        .kategori {
            background: #fff;
            border-radius: 16px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: #222;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            transition: 0.2s;
        }


        .kategori:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }


        .kategori .ikon {
            font-size: 55px;
            margin-bottom: 15px;
        }


        .kategori h2 {
            margin: 10px 0;
        }


        .kategori p {
            color: #777;
            margin: 0;
        }


        @media (max-width: 700px) {

            .container {
                margin: 25px auto;
            }


            .kategoriler {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <header>

        <a href="index.html">
            ← Ana Sayfaya Dön
        </a>

    </header>


    <div class="container">

        <h1>
            🛍️ Ürün Kategorileri
        </h1>


        <div class="kategoriler">


            <a
                class="kategori"
                href="kategori.html?kategori=bileklik"
            >

                <div class="ikon">
                    🧿
                </div>

                <h2>
                    El İşi Bileklik
                </h2>

                <p>
                    El yapımı bileklikler
                </p>

            </a>


            <a
                class="kategori"
                href="kategori.html?kategori=klavye"
            >

                <div class="ikon">
                    ⌨️
                </div>

                <h2>
                    Klavye
                </h2>

                <p>
                    Gaming klavyeler
                </p>

            </a>


            <a
                class="kategori"
                href="kategori.html?kategori=mousepad"
            >

                <div class="ikon">
                    🖱️
                </div>

                <h2>
                    Mouse Pad
                </h2>

                <p>
                    Gaming mouse padler
                </p>

            </a>


            <a
                class="kategori"
                href="kategori.html?kategori=kulaklik"
            >

                <div class="ikon">
                    🎧
                </div>

                <h2>
                    Kulaklık
                </h2>

                <p>
                    Gaming kulaklıklar
                </p>

            </a>


        </div>

    </div>


</body>

</html>
