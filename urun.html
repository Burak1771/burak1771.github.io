<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ürün Detayı</title>


    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #0066ff;
            padding: 20px 6%;
        }

        header a {
            color: #fff;
            text-decoration: none;
        }

        .detay {
            max-width: 1100px;
            margin: 40px auto;
            background: #fff;
            border-radius: 16px;
            padding: 35px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 45px;
        }

        .resim img {
            width: 100%;
            height: 450px;
            object-fit: contain;
        }

        h1 {
            font-size: 36px;
        }

        .puan {
            color: #f2a900;
            font-size: 18px;
        }

        .eski {
            text-decoration: line-through;
            color: #999;
        }

        .fiyat {
            font-size: 34px;
            font-weight: bold;
        }

        .stok {
            color: #159447;
        }

        .ozellikler {
            border-top: 1px solid #ddd;
            margin-top: 25px;
            padding-top: 15px;
        }

        .ozellikler li {
            margin: 12px 0;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 10px;
            background: #ff6000;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 700px) {

            .detay {
                grid-template-columns: 1fr;
                margin: 20px;
                padding: 20px;
            }

            .resim img {
                height: 300px;
            }

        }

    </style>

</head>


<body>


    <header>

        <a href="index.html">
            ← Ürünlere Dön
        </a>

    </header>


    <div class="detay">


        <div class="resim">

            <img
                id="resim"
                src="resim.jpg"
            >

        </div>


        <div>

            <h1 id="ad"></h1>

            <div
                class="puan"
                id="puan"
            ></div>

            <div
                class="eski"
                id="eski"
            ></div>

            <div
                class="fiyat"
                id="fiyat"
            ></div>

            <div
                class="stok"
                id="stok"
            ></div>


            <div class="ozellikler">

                <h2>
                    Ürün Özellikleri
                </h2>

                <ul id="ozellik"></ul>

            </div>


            <button onclick="sepeteEkle()">
                🛒 Sepete Ekle
            </button>

        </div>

    </div>


    <script>


        const u = {

            mouse: {

                ad: 'El İşi Bileklik',

                fiyat: 265,

                eski: '350 TL',
               
                puan: '⭐⭐⭐⭐⭐ 4.8 / 5',

                stok: '🟢 Stokta 25 adet',

                oz: [
                    ' Bileğe Göre Boyutlar',
                    ' Çeşit Çeşit renk'
                ]

            },


            klavye: {

                ad: 'RGB Gaming Klavye',

                fiyat: 2299,

                eski: '2.799 TL',

                puan: '⭐⭐⭐⭐⭐ 4.7 / 5',

                stok: '🟢 Stokta 12 adet',

                oz: [
                    '⌨️ Gaming klavye',
                    '🌈 RGB aydınlatma',
                    '⚡ Hızlı tepki',
                    '🎮 Oyuncu tasarımı',
                    '🔌 USB bağlantı',
                    '🖤 Dayanıklı tuşlar'
                ]

            },


            mousepad: {

                ad: '90x40 Gaming Mouse Pad',

                fiyat: 699,

                eski: '899 TL',

                puan: '⭐⭐⭐⭐⭐ 4.9 / 5',

                stok: '🟢 Stokta 40 adet',

                oz: [
                    '📏 90x40 cm',
                    '🖱️ Gaming mouse pad',
                    '💧 Suya dayanıklı yüzey',
                    '⚡ Hassas mouse hareketi',
                    '⬛ Kaymaz taban',
                    '🎮 Oyuncular için uygun'
                ]

            },


            kulaklik: {

                ad: 'Gaming Kulaklık',

                fiyat: 1599,

                eski: '1.999 TL',

                puan: '⭐⭐⭐⭐☆ 4.6 / 5',

                stok: '🟢 Stokta 18 adet',

                oz: [
                    '🎧 Gaming kulaklık',
                    '🔊 Yüksek ses kalitesi',
                    '🎤 Dahili mikrofon',
                    '🎮 Oyuncu tasarımı',
                    '🔌 USB bağlantı',
                    '🎵 Stereo ses'
                ]

            }

        };


        const id =
            new URLSearchParams(location.search).get('urun') || 'mouse';


        const p =
            u[id] || u.mouse;


        ad.textContent =
            p.ad;


        fiyat.textContent =
            p.fiyat.toLocaleString('tr-TR') + ' TL';


        eski.textContent =
            p.eski;


        puan.textContent =
            p.puan;


        stok.textContent =
            p.stok;


        p.oz.forEach(function (x) {

            let li =
                document.createElement('li');

            li.textContent =
                x;

            ozellik.appendChild(li);

        });


        function sepeteEkle() {

            let s =
                JSON.parse(
                    localStorage.getItem('sepet') || '[]'
                );


            s.push({
                ad: p.ad,
                fiyat: p.fiyat
            });


            localStorage.setItem(
                'sepet',
                JSON.stringify(s)
            );


            alert(
                p.ad + ' sepete eklendi! 🛒'
            );

        }


    </script>


</body>

</html>
