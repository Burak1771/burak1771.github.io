<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim - Elay Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 22px 6%;
            background: linear-gradient(135deg,#6f4428,#9c704e);
            color: #fff;
        }

        header h1 {
            margin: 0;
        }

        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        #cikisBtn {
            padding: 7px 10px;
            border: 1px solid #fff;
            border-radius: 7px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        main {
            width: min(1000px, calc(100% - 32px));
            margin: 40px auto;
        }

        .sepet-kutusu {
            padding: 25px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 4px 18px #00000012;
        }

        .sepet-item {
            display: grid;
            grid-template-columns: 90px 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 16px 0;
            border-bottom: 1px solid #eee;
        }

        .sepet-item img {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            object-fit: contain;
            background: #f8f8f8;
        }

        .urun-adi {
            margin: 0 0 7px;
            font-size: 18px;
            font-weight: bold;
        }

        .urun-fiyat {
            font-size: 18px;
            font-weight: bold;
        }

        .sil-btn {
            border: 0;
            border-radius: 8px;
            padding: 9px 12px;
            background: #fff0f0;
            color: #b62020;
            cursor: pointer;
            font-weight: bold;
        }

        .ozet {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .toplam {
            font-size: 24px;
            font-weight: bold;
        }

        .temizle-btn {
            border: 0;
            border-radius: 9px;
            padding: 11px 16px;
            background: #222;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        .bos {
            padding: 35px 10px;
            text-align: center;
            color: #666;
        }

        .devam {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 18px;
            border-radius: 9px;
            background: #0066ff;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            header {
                display: block;
            }

            nav {
                margin-top: 15px;
            }

            .sepet-item {
                grid-template-columns: 70px 1fr;
            }

            .sepet-item img {
                width: 70px;
                height: 70px;
            }

            .sil-btn {
                grid-column: 1 / -1;
            }

            .ozet {
                align-items: stretch;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Elay Store</h1>

        <nav>
            <a href="index.html">Ürünler</a>
            <a id="uyeBaglanti" href="uye.html">👤 Üye Ol / Giriş Yap</a>
            <button id="cikisBtn" type="button" hidden>Çıkış Yap</button>
            <a href="sepet.html">🛒 Sepet (<span id="sepetSayi">0</span>)</a>
        </nav>
    </header>

    <main>
        <h2>🛒 Sepetim</h2>

        <section class="sepet-kutusu">
            <div id="sepetListe" aria-live="polite"></div>

            <div id="ozet" class="ozet">
                <div class="toplam">
                    Toplam: <span id="toplam">0</span> TL
                </div>

                <button class="temizle-btn" type="button" onclick="sepetiTemizle()">
                    Sepeti Temizle
                </button>
            </div>
        </section>

        <a class="devam" href="index.html">← Alışverişe Devam Et</a>
    </main>

    <script>
        let sepet = [];

        try {
            sepet = JSON.parse(localStorage.getItem("sepet") || "[]");
            if (!Array.isArray(sepet)) sepet = [];
        } catch (hata) {
            sepet = [];
        }

        function kaydet() {
            localStorage.setItem("sepet", JSON.stringify(sepet));
        }

        function sil(index) {
            sepet.splice(index, 1);
            kaydet();
            sepetGoster();
        }

        function sepetiTemizle() {
            sepet = [];
            kaydet();
            sepetGoster();
        }

        function sepetGoster() {
            const liste = document.getElementById("sepetListe");
            const ozet = document.getElementById("ozet");
            const toplamAlani = document.getElementById("toplam");
            const sepetSayi = document.getElementById("sepetSayi");

            sepetSayi.textContent = sepet.length;
            liste.replaceChildren();

            if (sepet.length === 0) {
                const bos = document.createElement("div");
                bos.className = "bos";
                bos.textContent = "Sepetiniz şu anda boş.";
                liste.appendChild(bos);
                ozet.hidden = true;
                return;
            }

            ozet.hidden = false;
            let toplam = 0;

            sepet.forEach(function (urun, index) {
                const fiyat = Number(urun.fiyat) || 0;
                toplam += fiyat;

                const satir = document.createElement("div");
                satir.className = "sepet-item";

                const resim = document.createElement("img");
                resim.src = urun.resim || "resim.jpg";
                resim.alt = urun.ad;

                const bilgi = document.createElement("div");
                const ad = document.createElement("p");
                ad.className = "urun-adi";
                ad.textContent = urun.ad;

                const fiyatAlani = document.createElement("div");
                fiyatAlani.className = "urun-fiyat";
                fiyatAlani.textContent = fiyat.toLocaleString("tr-TR") + " TL";
                bilgi.append(ad, fiyatAlani);

                const silButonu = document.createElement("button");
                silButonu.className = "sil-btn";
                silButonu.type = "button";
                silButonu.textContent = "❌ Sepetten Sil";
                silButonu.addEventListener("click", function () {
                    sil(index);
                });

                satir.append(resim, bilgi, silButonu);
                liste.appendChild(satir);
            });

            toplamAlani.textContent = toplam.toLocaleString("tr-TR");
        }

        sepetGoster();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKpEI_TzDxA38N30BEjMScnl0GnYabl3c",
            authDomain: "elaystore-c4d53.firebaseapp.com",
            projectId: "elaystore-c4d53",
            storageBucket: "elaystore-c4d53.firebasestorage.app",
            messagingSenderId: "585341292448",
            appId: "1:585341292448:web:51ace255ab2fcf89b21ec5",
            measurementId: "G-YMS32EVTTH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const uyeBaglanti = document.getElementById("uyeBaglanti");
        const cikisBtn = document.getElementById("cikisBtn");

        onAuthStateChanged(auth, function (user) {
            if (user) {
                const ad = user.displayName || user.email.split("@")[0];
                uyeBaglanti.textContent = "👋 Hoş geldin, " + ad;
                uyeBaglanti.removeAttribute("href");
                cikisBtn.hidden = false;
            } else {
                uyeBaglanti.textContent = "👤 Üye Ol / Giriş Yap";
                uyeBaglanti.href = "uye.html";
                cikisBtn.hidden = true;
            }
        });

        cikisBtn.addEventListener("click", async function () {
            await signOut(auth);
        });
    </script>
</body>
</html>
